services:
  - type: web
    name: wolimons-api-proxy
    runtime: node
    plan: free
    rootDir: proxy
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: UPSTREAM_ORIGIN
        value: https://wanwoo.xyz
      - key: CACHE_TTL_MS
        value: "60000"
      # Optional: restrict who may call the proxy. Comma-separated, no spaces.
      # - key: ALLOWED_ORIGINS
      #   value: https://yourname.github.io,http://localhost:8080
      # The admin panel has no key - /admin is open to whoever can reach the
      # server. An old ADMIN_KEY is read only as seed for identity-token
      # signing; it unlocks nothing and can be left unset.
      # - key: ADMIN_KEY
      #   sync: false
      # A GitHub token with write access to this repo. Without it the admin
      # panel is read-only, because saving means committing the data file.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: ratemyavatar/Wolimons
      - key: GITHUB_BRANCH
        value: main
