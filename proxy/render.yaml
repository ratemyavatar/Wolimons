services:
  - type: web
    name: wolimons-api-proxy
    runtime: node
    plan: free
    rootDir: proxy
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: UPSTREAM_ORIGIN
        value: https://wanwoo.xyz
      - key: CACHE_TTL_MS
        value: "60000"
      # Optional: restrict who may call the proxy. Comma-separated, no spaces.
      # - key: ALLOWED_ORIGINS
      #   value: https://yourname.github.io,http://localhost:8080
